# Duplication baseline (jscpd, 60-token floor, identifiers/literals ignored) — main sources
# only; the test tree is reported by `scripts/duplication_report.py` but never gates (see
# documentation/duplication.md). `scripts/duplication_check.py` fails when the measured main
# percentage rises more than 0.3 points above `main.percent`, or when a non-exempt cluster is
# larger than `main.largestCluster` — see config/duplication/exemptions.txt for what is exempt
# and why.
#
# Recorded from the first scan, floored to measured (the same idiom this build already uses for
# coverage and mutation-score floors): lower this with the commit that removes the duplication,
# never raise it without a reasoned exemption line instead.
# main.percent still counts exempt data-table and wide-record rows (the clarity `_*_data.py`
# modules, rendering.py's flat/structured channels, and the CanonicalEntry/SpanContext wide
# records, all exempted by path — see config/duplication/exemptions.txt); main.largestCluster is
# the largest NON-exempt cluster (generic_tokens.py's own two-section word-list duplication, 185
# tokens — left unexempt on purpose: unlike the `_*_data.py` modules, this file also holds real
# scoring logic, so a path-based exemption for it would mask logic duplication along with data).
#
# `recorded`/`commit` are free-text markers, never commit SHAs (owner ruling 2026-09-12): a hash
# pins this file to a specific tree that later moves, where a date/marker string does not invite
# that reading.
recorded=2026-09-12
commit=first-scan
main.percent=13.0
main.largestCluster=185
