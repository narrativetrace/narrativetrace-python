name: Publish

# Public release — authored in the private tree like ci.yml and shipped with the snapshot.
# Fires on the annotated v<version> tag the (private) release pipeline pushes; the `release`
# environment (required reviewer, v* tags only — set up once during one-time repository setup)
# gates the job, so publishing happens only after a human approves this exact run.
#
# Publishing uses PyPI Trusted Publishing (OIDC): pypa/gh-action-pypi-publish exchanges this
# workflow's identity token for a short-lived upload credential per project, so no long-lived
# PyPI API token exists anywhere to leak or rotate. Each narrativetrace* project's Trusted
# Publisher settings on pypi.org pin this exact repository, this exact workflow file path
# (.github/workflows/publish.yml — renaming it breaks publishing on purpose) and the `release`
# environment. Eight of the nine workspace members publish; narrativetrace-security-tests
# carries "Private :: Do Not Upload" and is deliberately never built or uploaded here (see its
# pyproject.toml) — its source still ships in the public snapshot, only the PyPI upload is
# skipped, mirroring the Java module of the same name and shape.

on:
  push:
    tags: ["v*"]
  # A manual run still passes the `release` environment, whose deployment policy admits v*
  # tags only — a dispatch from a branch is refused at the gate, the "refuse a dispatch off
  # the release tag" step below refuses it again by ref type, and the tag-vs-version
  # assertion refuses it a third time by content. Always dispatch on the tag ref (`gh
  # workflow run publish.yml --ref v<version>`), never on `main`.
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated subset of the publishable packages, or empty for all of them.
          A subset exists for one reason: PyPI rate-limits NEW PROJECT creation, so a
          release can legitimately reach the names that already exist before the rest.
          Every name must still be one of the eight below; publishing a subset is safe
          because the dependency direction is one-way (every package depends on
          narrativetrace, nothing depends on the optional integrations). Dispatch this
          workflow on the release tag (e.g. `--ref v0.1.2`), never on `main` — the job
          refuses any other ref.
        required: false
        default: ""

permissions:
  contents: read

# The packages that publish, in workspace order (see the header comment above for the one
# that deliberately does not).
env:
  PUBLISHABLE_PACKAGES: >-
    narrativetrace
    narrativetrace-asgi
    narrativetrace-clarity
    narrativetrace-diagrams
    narrativetrace-glossary
    narrativetrace-otel
    narrativetrace-pytest
    narrativetrace-structlog

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Trusted Publishing: pypa/gh-action-pypi-publish presents this job's OIDC token to
      # pypi.org in exchange for a temporary upload credential, per project.
      id-token: write
    steps:
      # A dispatch's GITHUB_REF_NAME/GITHUB_REF_TYPE are whatever ref the dispatch chose — the
      # `release` environment's deployment policy admits v* tags only, so a dispatch from a
      # branch is refused at the gate too, but this fails loudly with a clear reason before
      # anything else runs rather than leaving the person who dispatched it to read the tag
      # assertion's unrelated-looking error below.
      - name: Refuse a dispatch off the release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
              tag:v*) ;;
              *) echo "dispatch this workflow on the release tag, not a branch"; exit 1 ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # Same check the (private) release pipeline already applies before it will create a tag
      # (detect_version + the *-SNAPSHOT*/*-dev*/0.0.0 refusal) — repeated here because the
      # tag is what actually triggers this job, and the workflow must not trust that the tag
      # it was handed is one the script produced. Every publishable package's own pyproject.toml
      # is read (not just the root one): the eight distributions are versioned in lockstep, and
      # a sibling that drifted out of step must fail the release, not publish silently apart
      # from what the tag claims.
      - name: Assert tag matches the workspace version
        run: |
          set -euo pipefail
          version=""
          for pkg in $PUBLISHABLE_PACKAGES; do
            pkg_version="$(sed -n 's/^version = "\(.*\)"/\1/p' "packages/$pkg/pyproject.toml" | head -1)"
            [ -n "$pkg_version" ] || {
              echo "could not read a version from packages/$pkg/pyproject.toml"; exit 1; }
            if [ -z "$version" ]; then
              version="$pkg_version"
            elif [ "$pkg_version" != "$version" ]; then
              echo "publishable packages disagree on version: $pkg is $pkg_version, expected $version"
              exit 1
            fi
          done
          [ -n "$version" ] || { echo "no publishable package versions found"; exit 1; }
          [ "v$version" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match workspace version $version"; exit 1; }
          case "$version" in
              *-SNAPSHOT*|*-dev*|0.0.0)
                  echo "refusing to release $version"; exit 1 ;;
          esac

      # The single quality gate — same invocation as ci.yml. A tag push does not imply the
      # tagged commit ever ran it (the public branch is pushed by hand after review), so it
      # runs again here rather than being trusted.
      - run: uv sync --all-packages
      - run: uv run poe check

      # A dispatch may narrow the set (see the input's description); every requested name is
      # checked against PUBLISHABLE_PACKAGES first, so a typo builds nothing rather than
      # silently publishing less than the release claims.
      - name: Build publishable distributions
        env:
          REQUESTED: ${{ inputs.packages }}
        run: |
          selected="$PUBLISHABLE_PACKAGES"
          if [ -n "$REQUESTED" ]; then
            for pkg in $REQUESTED; do
              case " $PUBLISHABLE_PACKAGES " in
                *" $pkg "*) ;;
                *) echo "refusing: '$pkg' is not a publishable package"; exit 1 ;;
              esac
            done
            selected="$REQUESTED"
            echo "publishing a SUBSET of this release: $selected"
          fi
          mkdir -p dist
          for pkg in $selected; do
            uv build --package "$pkg" --out-dir dist
          done
          ls -1 dist

      # --skip-existing (via skip-existing below) makes a re-run after a partial failure
      # safe: already-published files are not re-rejected as errors. Attestations (PEP 740)
      # ride Trusted Publishing automatically — no separate signing step or secret.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true
