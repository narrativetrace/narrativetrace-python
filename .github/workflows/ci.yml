name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.12-bookworm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # this container job's checkout is owned by a different uid than the one running these
      # steps, so git refuses every command in it ("dubious ownership") until told this workspace
      # is trusted -- without this, poe check's tree-writes guard runs in its weaker fallback mode.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: uv sync --all-packages
      # jscpd (poe duplication-check, part of poe check) needs Node -- missing from this image
      # by default (verified 2026-09-12); see scripts/install-node.sh and documentation/duplication.md.
      - run: scripts/install-node.sh
      - run: uv run poe check
