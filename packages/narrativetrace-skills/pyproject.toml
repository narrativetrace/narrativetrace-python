[project]
name = "narrativetrace-skills"
version = "0.3.0"
description = "The published skills carrier: rendered agent-skill pages (SKILL.md) + catalogue.json for narrativetrace's free skills -- resources only, no Python API"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Apache-2.0, not BUSL-1.1 like every other distribution in this repository: mirrors the Java
# carrier this ports (licensing.properties: module.narrativetrace-skills=open). One byte-identical
# copy of the root LICENSE-APACHE, because PEP 639 forbids reaching out of the project directory —
# see packages/narrativetrace/tests/test_distribution_licensing.py's APACHE_DISTRIBUTIONS.
license-files = ["LICENSE"]
authors = [{ name = "narrativetrace contributors" }]
keywords = ["tracing", "observability", "agent-skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]
# No sources and no dependencies, mirroring Java's narrativetrace-skills module exactly: what an
# installer reads out of this distribution is text (SKILL.md pages + catalogue.json), never
# something imported. Published (no "Private :: Do Not Upload" classifier) -- unlike the typed
# catalogue that renders it (narrativetrace-skills-catalogue), this is the artifact a consumer's
# `init` verb (a future milestone) actually resolves, at exactly the project's installed version.
dependencies = []

[project.urls]
Homepage = "https://github.com/narrativetrace/narrativetrace-python"
Source = "https://github.com/narrativetrace/narrativetrace-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No Python package: the wheel's payload is the `skills/` directory itself (rendered pages +
# catalogue.json), installed as a plain top-level directory under site-packages -- there is no
# `narrativetrace_skills_carrier` import name to resolve, deliberately, since nothing in this
# distribution is ever imported (see the dependencies comment above). Checked in as committed
# BUILD OUTPUT of narrativetrace-skills-catalogue's render step (scripts/skills_render.py), never
# hand-edited; the packaging test (test_carrier_wheel_contents.py) opens the real built wheel and
# asserts its exact member list.
[tool.hatch.build.targets.wheel]
packages = ["skills"]

[tool.hatch.build.targets.sdist]
include = ["skills/**", "LICENSE", "README.md", "pyproject.toml"]
