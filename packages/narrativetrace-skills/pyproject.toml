[project]
name = "narrativetrace-skills"
version = "0.1.2"
description = "Typed catalogue source for NarrativeTrace's agent skills — renders SKILL.md/AGENTS.md"
readme = "README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
# See packages/narrativetrace/pyproject.toml: one byte-identical copy of the root LICENSE per
# distribution, because PEP 639 forbids reaching out of the project directory.
license-files = ["LICENSE"]
authors = [{ name = "narrativetrace contributors" }]
keywords = ["tracing", "observability", "agent-skills"]
# "Private :: Do Not Upload" is the standard PyPI/twine convention for a package that must never
# reach the index (see packages/narrativetrace-security-tests/pyproject.toml). This is a
# build-time catalogue source -- it renders SKILL.md/AGENTS.md, never something a consumer
# installs -- and scripts/verify_publication_packages.py derives "publishable" from the absence
# of this classifier, so without it the nightly canary would expect this package on PyPI forever.
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Deliberately dependency-free, same discipline as the core `narrativetrace` distribution: a
# catalogue of prose and shell-command strings needs nothing at runtime, and never imports
# `narrativetrace` itself -- the two skills invoke the free CLI as a subprocess, they do not call
# into the library.
dependencies = []

[project.urls]
Homepage = "https://github.com/narrativetrace/narrativetrace-python"
Source = "https://github.com/narrativetrace/narrativetrace-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrativetrace_skills"]

# Mutation config for the Tier B eval runner lives in evals/pyproject.toml, not here -- mutmut
# runs from evals/ itself (`uv run poe mutate-skills`), not from this package's root, because the
# runner's cross-imports are flat (`import quota`, not `narrativetrace_skills.evals.quota`) and
# mutmut derives a mutant's key from the path relative to its own cwd. See that file's own
# comment, and [tool.narrativetrace.mutation.package_dir] in the root pyproject.toml.
