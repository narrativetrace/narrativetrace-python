# Config home for `uv run poe mutate-skills` (cwd = this directory, via
# [tool.narrativetrace.mutation.package_dir] in the root pyproject.toml) -- deliberately NOT
# packages/narrativetrace-skills-catalogue/pyproject.toml itself. Mutmut derives a mutant's key
# from the path relative to its own cwd (see packages/narrativetrace/pyproject.toml's [tool.mutmut]
# comment), and this package's eval runner is imported flat (`import quota`, `from
# tier_precondition import ...`, not a dotted `narrativetrace_skills.evals.*` path) -- run.py's
# own docstring and README.md both invoke it as `uv run python evals/run.py ...` from the repo
# root or from here, and the test files match that with plain `import run`/`from quota import
# ...`. Running mutmut from evals/ itself, not the package root, makes its derived keys
# ("run.x_...", "quota.x_...") match exactly what those flat imports already produce -- no
# changes needed to any production or test import.
#
# Case content under evals/ (prompts, fixtures, graders, trigger.yaml, case.json) is data and
# stays out of mutation scope by construction: source_paths below lists only the runner
# .py modules, so mutmut never walks anything else here.
[tool.mutmut]
source_paths = [
    "run.py",
    "quota.py",
    "platform_presets.py",
    "tier_precondition.py",
    "isolated_agent_config.py",
    "registry_delivery.py",
    "trial_environment.py",
    "case_turns.py",
    "agent_turns.py",
]
also_copy = [
    "test_run.py",
    "test_quota.py",
    "test_platform_presets.py",
    "test_tier_precondition.py",
    "test_isolated_agent_config.py",
    "test_registry_delivery.py",
    "test_adversarial_registry.py",
    "test_trial_environment.py",
    "test_case_turns.py",
    "test_agent_turns.py",
]
# Not run under the copy, deliberately: these test files import the graders under the case
# directories (narrativetrace-*/, add-*/) and read evals/fixtures/, none of which mutmut copies --
# run from mutants/ they fail collection (ModuleNotFoundError) and, with -x, take every mutant's
# run down with them. Dropping them from also_copy was not enough: mutmut copies every
# `test*.py` beside the config regardless (configuration.py globs it), so the files are kept out
# of the RUN with --ignore below. The graders are case content (not in source_paths); the runner
# behaviour those files pin is also pinned by the copied files above.
# Same reason as packages/narrativetrace/pyproject.toml's identical line: the pytest plugin
# distribution imports narrativetrace at plugin-load time, before the mutated copy is on sys.path.
pytest_add_cli_args = ["-p", "no:narrativetrace", "--ignore=test_adversarial_clarity.py", "--ignore=test_adversarial_trials.py", "--ignore=test_clarity_graders.py", "--ignore=test_debug_graders.py", "--ignore=test_fastapi_grader.py", "--ignore=test_feedback_graders.py", "--ignore=test_verify_graders.py"]
