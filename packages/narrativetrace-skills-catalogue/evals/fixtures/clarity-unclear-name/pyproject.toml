[project]
# Not a uv workspace member (see README.md) -- a standalone fixture the eval runner scaffolds into
# a scratch directory. It has no NarrativeTrace dependency: adding the clarity gate is the agent's job.
name = "orders-service-fixture"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders"]

[tool.pytest.ini_options]
pythonpath = ["src"]
