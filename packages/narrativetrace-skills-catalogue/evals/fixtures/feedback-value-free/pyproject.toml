[project]
# Not a uv workspace member (see README.md) -- a standalone fixture the eval runner scaffolds into a
# scratch directory, resolving NarrativeTrace from this checkout's own build.
name = "feedback-value-free-fixture"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["narrativetrace"]

[dependency-groups]
dev = ["pytest>=8", "narrativetrace-pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]
