[project]
name = "contract-probe"
version = "0.0.0"
description = """A small, standalone project that proves documentation/contract.yaml's claims \
against a PUBLISHED PyPI install -- never this workspace, never --find-links. See \
documentation/contract-gate.md."""
requires-python = ">=3.12"
# pyyaml only: the packages this probe proves claims about (narrativetrace, narrativetrace-pytest,
# ...) are installed per invocation at the exact version under test via
# `uv run --with <name>==<version> ...` (see scripts/contract_check.py), never declared as a fixed
# dependency here -- a fixed dependency would pin one version forever, defeating the point.
dependencies = ["pyyaml>=6"]

[project.scripts]
contract-probe = "contract_probe.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_probe"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
